<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Дневник" />
<meta name="theme-color" content="#1a1614" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<title>Дневник мыслей</title>
<style>
  /* ============ ТИПОГРАФИКА И ОСНОВА ============ */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1a1614;
    --bg-soft: #221c19;
    --bg-elev: #2a2320;
    --ink: #f5ede4;
    --ink-soft: #c9bdb0;
    --ink-mute: #8a7e72;
    --accent: #d4a574;
    --accent-soft: #b88a5a;
    --border: rgba(245,237,228,0.08);
    --border-strong: rgba(245,237,228,0.16);
    --danger: #c97064;
    --shadow: 0 20px 50px rgba(0,0,0,0.4);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Manrope', -apple-system, sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    overscroll-behavior-y: contain;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(80px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
    background-image:
      radial-gradient(ellipse at top left, rgba(212,165,116,0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(184,138,90,0.04), transparent 50%);
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; resize: none; width: 100%; }

  /* ============ ШАПКА ============ */
  header {
    padding: 24px 20px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    background: rgba(26,22,20,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .brand h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.5px;
    font-style: italic;
  }
  .brand h1 span { color: var(--accent); }
  .menu-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: background 0.2s;
  }
  .menu-btn:active { background: var(--bg-elev); }

  /* ============ ВКЛАДКИ РАЗДЕЛОВ ============ */
  .tabs {
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    margin-top: 16px; padding-bottom: 4px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .tab.add-tab {
    color: var(--accent);
    border-style: dashed;
    border-color: var(--border-strong);
  }

  /* ============ КОНТЕНТ ============ */
  main {
    padding: 20px;
    max-width: 720px;
    margin: 0 auto;
  }
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px;
  }
  .section-title h2 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .section-title .count {
    color: var(--ink-mute);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ============ ПОЛЕ ВВОДА ============ */
  .composer {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }
  .composer:focus-within { border-color: var(--accent-soft); }
  .composer textarea {
    font-size: 16px;
    line-height: 1.5;
    min-height: 24px;
    max-height: 200px;
  }
  .composer textarea::placeholder {
    color: var(--ink-mute);
    font-style: italic;
    font-family: var(--serif);
    font-size: 18px;
  }
  .composer-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 12px;
  }
  .btn {
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:active { background: var(--accent-soft); }
  .btn-primary:disabled { opacity: 0.4; }
  .btn-ghost { color: var(--ink-mute); }

  /* ============ КАРТОЧКИ ЗАПИСЕЙ ============ */
  .entries { display: flex; flex-direction: column; gap: 12px; }
  .entry {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    position: relative;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .entry-text {
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .entry-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-mute);
    letter-spacing: 0.3px;
  }
  .entry-actions { display: flex; gap: 14px; }
  .entry-actions button {
    font-size: 12px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .entry-actions button:active { color: var(--accent); }
  .entry.done .entry-text {
    text-decoration: line-through;
    color: var(--ink-mute);
  }

  /* Группировка по датам (для записей по дням) */
  .day-group { margin-bottom: 28px; }
  .day-label {
    font-family: var(--serif);
    font-size: 18px;
    font-style: italic;
    color: var(--accent);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* Пустое состояние */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-mute);
  }
  .empty .icon {
    font-family: var(--serif);
    font-size: 48px;
    font-style: italic;
    color: var(--accent);
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty p {
    font-family: var(--serif);
    font-size: 18px;
    font-style: italic;
  }

  /* ============ МОДАЛКА МЕНЮ ============ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    animation: fadeIn 0.2s;
  }
  .modal-backdrop.show { display: block; }
  .modal {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }
  .modal.show { transform: translateY(0); }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal h3 {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 18px;
  }
  .menu-list { display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 12px;
    border-radius: 10px;
    font-size: 15px;
    text-align: left;
    transition: background 0.2s;
  }
  .menu-item:active { background: var(--bg-soft); }
  .menu-item .ic { font-size: 20px; width: 24px; text-align: center; }
  .menu-item .lbl { flex: 1; }
  .menu-item .sub { font-size: 12px; color: var(--ink-mute); }
  .menu-item.danger { color: var(--danger); }

  /* Редактирование разделов */
  .sections-edit { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .section-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bg-soft);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .section-row input {
    flex: 1;
    font-size: 15px;
  }
  .section-row .rm-btn {
    color: var(--danger);
    font-size: 18px;
    padding: 4px 8px;
  }
  .add-section-btn {
    padding: 12px;
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    color: var(--accent);
    font-size: 14px;
    width: 100%;
  }

  /* ============ ТОСТ ============ */
  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ ОРНАМЕНТ ============ */
  .ornament {
    text-align: center;
    color: var(--accent);
    opacity: 0.4;
    margin: 30px 0;
    font-family: var(--serif);
    letter-spacing: 12px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Дневник <span>мыслей</span></h1>
    <button class="menu-btn" id="menuBtn" aria-label="Меню">≡</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="section-title">
    <h2 id="sectionTitle">—</h2>
    <span class="count" id="sectionCount">0</span>
  </div>

  <div class="composer">
    <textarea id="composer" placeholder="Что у тебя на уме..." rows="1"></textarea>
    <div class="composer-actions">
      <button class="btn btn-ghost" id="clearBtn">Очистить</button>
      <button class="btn btn-primary" id="addBtn" disabled>Записать</button>
    </div>
  </div>

  <div id="entries" class="entries"></div>
</main>

<!-- Меню -->
<div class="modal-backdrop" id="backdrop"></div>
<div class="modal" id="menuModal">
  <div class="modal-handle"></div>
  <h3>Меню</h3>
  <div class="menu-list">
    <button class="menu-item" id="editSectionsBtn">
      <span class="ic">✎</span>
      <span class="lbl">Управлять разделами<div class="sub">Добавить, переименовать, удалить</div></span>
    </button>
    <button class="menu-item" id="exportBtn">
      <span class="ic">↓</span>
      <span class="lbl">Скачать память<div class="sub">Сохранить всё в файл</div></span>
    </button>
    <button class="menu-item" id="importBtn">
      <span class="ic">↑</span>
      <span class="lbl">Загрузить память<div class="sub">Восстановить из файла</div></span>
    </button>
    <button class="menu-item danger" id="clearAllBtn">
      <span class="ic">⌫</span>
      <span class="lbl">Очистить раздел<div class="sub">Удалить все записи текущего раздела</div></span>
    </button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none" />
</div>

<!-- Управление разделами -->
<div class="modal" id="sectionsModal">
  <div class="modal-handle"></div>
  <h3>Разделы</h3>
  <div class="sections-edit" id="sectionsEdit"></div>
  <button class="add-section-btn" id="addSectionBtn">+ Добавить раздел</button>
  <div style="display:flex; gap:8px; margin-top:18px;">
    <button class="btn btn-ghost" id="cancelSectionsBtn" style="flex:1; border:1px solid var(--border);">Отмена</button>
    <button class="btn btn-primary" id="saveSectionsBtn" style="flex:2;">Сохранить</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ДАННЫЕ И ХРАНИЛИЩЕ
   ============================================================ */
const STORAGE_KEY = 'diary_data_v1';

const DEFAULT_DATA = {
  sections: [
    { id: 's_thoughts', name: 'Мысли', type: 'note' },
    { id: 's_tasks', name: 'Задачи', type: 'task' },
    { id: 's_goals', name: 'Цели', type: 'note' },
    { id: 's_plans', name: 'Планы', type: 'note' },
    { id: 's_daily', name: 'Дневник', type: 'daily' }
  ],
  entries: {},  // {sectionId: [{id, text, ts, done}]}
  currentSectionId: 's_thoughts'
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    // защита на случай поломки
    if (!parsed.sections || !parsed.entries) return structuredClone(DEFAULT_DATA);
    return parsed;
  } catch (e) {
    return structuredClone(DEFAULT_DATA);
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('Ошибка сохранения');
  }
}

let state = loadData();

// Убеждаемся, что текущий раздел существует
if (!state.sections.find(s => s.id === state.currentSectionId)) {
  state.currentSectionId = state.sections[0]?.id || null;
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function uid() { return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }

function formatTime(ts) {
  const d = new Date(ts);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const sameYesterday = d.toDateString() === yesterday.toDateString();
  const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return 'Сегодня, ' + time;
  if (sameYesterday) return 'Вчера, ' + time;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ', ' + time;
}

function formatDay(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Сегодня';
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
}

function dayKey(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   РЕНДЕРИНГ
   ============================================================ */
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  state.sections.forEach(s => {
    const b = document.createElement('button');
    b.className = 'tab' + (s.id === state.currentSectionId ? ' active' : '');
    b.textContent = s.name;
    b.onclick = () => {
      state.currentSectionId = s.id;
      saveData();
      render();
    };
    tabs.appendChild(b);
  });
}

function getCurrentSection() {
  return state.sections.find(s => s.id === state.currentSectionId);
}

function renderEntries() {
  const section = getCurrentSection();
  const list = document.getElementById('entries');
  const titleEl = document.getElementById('sectionTitle');
  const countEl = document.getElementById('sectionCount');
  const composerEl = document.getElementById('composer');

  if (!section) {
    titleEl.textContent = 'Нет разделов';
    list.innerHTML = '';
    countEl.textContent = '0';
    return;
  }

  titleEl.textContent = section.name;
  const entries = (state.entries[section.id] || []).slice().sort((a, b) => b.ts - a.ts);
  countEl.textContent = entries.length;

  // плейсхолдер под тип
  const placeholders = {
    task: 'Что нужно сделать...',
    daily: 'Запись на сегодня...',
    note: 'Что у тебя на уме...'
  };
  composerEl.placeholder = placeholders[section.type] || placeholders.note;

  list.innerHTML = '';

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">✦</div><p>Здесь пока тихо.<br>Напиши первую запись.</p></div>';
    return;
  }

  // Группировка по дням для типа daily
  if (section.type === 'daily') {
    let lastDay = null;
    entries.forEach(e => {
      const key = dayKey(e.ts);
      if (key !== lastDay) {
        const grp = document.createElement('div');
        grp.className = 'day-label';
        grp.textContent = formatDay(e.ts);
        list.appendChild(grp);
        lastDay = key;
      }
      list.appendChild(renderEntry(e, section));
    });
  } else {
    entries.forEach(e => list.appendChild(renderEntry(e, section)));
  }
}

function renderEntry(e, section) {
  const div = document.createElement('div');
  div.className = 'entry' + (e.done ? ' done' : '');

  const text = document.createElement('div');
  text.className = 'entry-text';
  text.textContent = e.text;
  div.appendChild(text);

  const meta = document.createElement('div');
  meta.className = 'entry-meta';
  meta.innerHTML = '<span>' + formatTime(e.ts) + '</span>';

  const actions = document.createElement('div');
  actions.className = 'entry-actions';

  if (section.type === 'task') {
    const tBtn = document.createElement('button');
    tBtn.textContent = e.done ? 'Вернуть' : 'Готово';
    tBtn.onclick = () => {
      e.done = !e.done;
      saveData(); render();
    };
    actions.appendChild(tBtn);
  }

  const editBtn = document.createElement('button');
  editBtn.textContent = 'Изм';
  editBtn.onclick = () => editEntry(e);
  actions.appendChild(editBtn);

  const delBtn = document.createElement('button');
  delBtn.textContent = 'Удал';
  delBtn.onclick = () => {
    if (confirm('Удалить запись?')) {
      state.entries[section.id] = state.entries[section.id].filter(x => x.id !== e.id);
      saveData(); render();
    }
  };
  actions.appendChild(delBtn);

  meta.appendChild(actions);
  div.appendChild(meta);
  return div;
}

function editEntry(e) {
  const newText = prompt('Изменить запись:', e.text);
  if (newText !== null && newText.trim() !== '') {
    e.text = newText.trim();
    saveData(); render();
  }
}

function render() {
  renderTabs();
  renderEntries();
}

/* ============================================================
   ВВОД НОВОЙ ЗАПИСИ
   ============================================================ */
const composer = document.getElementById('composer');
const addBtn = document.getElementById('addBtn');
const clearBtn = document.getElementById('clearBtn');

composer.addEventListener('input', () => {
  composer.style.height = 'auto';
  composer.style.height = Math.min(composer.scrollHeight, 200) + 'px';
  addBtn.disabled = composer.value.trim() === '';
});

addBtn.onclick = () => {
  const text = composer.value.trim();
  if (!text) return;
  const section = getCurrentSection();
  if (!section) return;
  if (!state.entries[section.id]) state.entries[section.id] = [];
  state.entries[section.id].push({
    id: uid(),
    text,
    ts: Date.now(),
    done: false
  });
  composer.value = '';
  composer.style.height = 'auto';
  addBtn.disabled = true;
  saveData();
  render();
};

clearBtn.onclick = () => {
  composer.value = '';
  composer.style.height = 'auto';
  addBtn.disabled = true;
};

/* ============================================================
   МЕНЮ
   ============================================================ */
const backdrop = document.getElementById('backdrop');
const menuModal = document.getElementById('menuModal');
const sectionsModal = document.getElementById('sectionsModal');

function openModal(modal) {
  backdrop.classList.add('show');
  modal.classList.add('show');
}
function closeAllModals() {
  backdrop.classList.remove('show');
  menuModal.classList.remove('show');
  sectionsModal.classList.remove('show');
}
backdrop.onclick = closeAllModals;

document.getElementById('menuBtn').onclick = () => openModal(menuModal);

/* ====== ЭКСПОРТ ====== */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'diary-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeAllModals();
  showToast('Память скачана');
};

/* ====== ИМПОРТ ====== */
const fileInput = document.getElementById('fileInput');
document.getElementById('importBtn').onclick = () => fileInput.click();
fileInput.onchange = (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.sections || !data.entries) throw new Error('Не тот файл');
      if (confirm('Заменить текущие данные данными из файла?')) {
        state = data;
        if (!state.sections.find(s => s.id === state.currentSectionId)) {
          state.currentSectionId = state.sections[0]?.id || null;
        }
        saveData();
        render();
        closeAllModals();
        showToast('Память загружена');
      }
    } catch (err) {
      alert('Не удалось прочитать файл: ' + err.message);
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
};

/* ====== ОЧИСТКА РАЗДЕЛА ====== */
document.getElementById('clearAllBtn').onclick = () => {
  const s = getCurrentSection();
  if (!s) return;
  if (confirm('Удалить все записи раздела «' + s.name + '»? Это нельзя отменить.')) {
    state.entries[s.id] = [];
    saveData();
    render();
    closeAllModals();
    showToast('Раздел очищен');
  }
};

/* ====== УПРАВЛЕНИЕ РАЗДЕЛАМИ ====== */
let draftSections = [];

document.getElementById('editSectionsBtn').onclick = () => {
  draftSections = state.sections.map(s => ({ ...s }));
  renderSectionsEdit();
  menuModal.classList.remove('show');
  sectionsModal.classList.add('show');
};

function renderSectionsEdit() {
  const wrap = document.getElementById('sectionsEdit');
  wrap.innerHTML = '';
  draftSections.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'section-row';

    const inp = document.createElement('input');
    inp.value = s.name;
    inp.placeholder = 'Название раздела';
    inp.oninput = (e) => { draftSections[idx].name = e.target.value; };
    row.appendChild(inp);

    const typeSel = document.createElement('select');
    typeSel.style.cssText = 'background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:13px;';
    ['note', 'task', 'daily'].forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = { note: 'Заметки', task: 'Задачи', daily: 'По дням' }[t];
      if (s.type === t) opt.selected = true;
      typeSel.appendChild(opt);
    });
    typeSel.onchange = (e) => { draftSections[idx].type = e.target.value; };
    row.appendChild(typeSel);

    const rm = document.createElement('button');
    rm.className = 'rm-btn';
    rm.textContent = '×';
    rm.onclick = () => {
      if (draftSections.length === 1) {
        alert('Должен остаться хотя бы один раздел');
        return;
      }
      if (confirm('Удалить раздел «' + s.name + '»? Все записи внутри тоже пропадут.')) {
        draftSections.splice(idx, 1);
        renderSectionsEdit();
      }
    };
    row.appendChild(rm);

    wrap.appendChild(row);
  });
}

document.getElementById('addSectionBtn').onclick = () => {
  draftSections.push({ id: 's_' + uid(), name: 'Новый раздел', type: 'note' });
  renderSectionsEdit();
};

document.getElementById('cancelSectionsBtn').onclick = closeAllModals;

document.getElementById('saveSectionsBtn').onclick = () => {
  // валидация
  for (const s of draftSections) {
    if (!s.name.trim()) {
      alert('У всех разделов должно быть название');
      return;
    }
  }
  // чистим записи у удалённых разделов
  const newIds = new Set(draftSections.map(s => s.id));
  Object.keys(state.entries).forEach(id => {
    if (!newIds.has(id)) delete state.entries[id];
  });
  state.sections = draftSections.map(s => ({ ...s, name: s.name.trim() }));
  if (!newIds.has(state.currentSectionId)) {
    state.currentSectionId = state.sections[0]?.id || null;
  }
  saveData();
  render();
  closeAllModals();
  showToast('Разделы сохранены');
};

/* ============================================================
   SERVICE WORKER (офлайн)
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ============================================================
   СТАРТ
   ============================================================ */
render();
</script>
</body>
</html>
